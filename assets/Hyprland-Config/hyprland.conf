################################################################################
### ZOPTYMALIZOWANA KONFIGURACJA HYPRLAND                                    ###
################################################################################

#################
### MONITORS ###
#################
# Ustawienia monitora (nadpisane przez wygenerowany config)
monitor = eDP-1, preferred, auto, 1.2

###################
### MY PROGRAMS ###
###################
$terminal = ghostty
$fileManager = thunar
$menu = /home/damian2120/.config/rofi/launchers/type-1/launcher.sh
$powermenu = /home/damian2120/.config/rofi/powermenu/type-3/powermenu.sh
$mainMod = SUPER
$browser = firefox

#################
### AUTOSTART ###
#################
# Odkomentuj poniższą linię, aby uruchamiać aplikacje przy starcie
exec-once = waybar & lxqt-policykit-agent# hyprpaper & firefox

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    # Odstępy między oknami i krawędziami
    gaps_in = 0
    gaps_out = 0
    border_size = 3

    # Kolory ramek (nadpisane przez HyprMod)
    #col.active_border = 0x98C379FF
    #col.inactive_border = 0xff000000

    # Opcje zmiany rozmiaru i interakcji z ramką
    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = false

    # Używany układ (scrolling narzucony przez nową konfigurację)
    layout = scrolling

    allow_tearing = false

    snap {
        enabled = false
    }
}

decoration {
    # Zaokrąglenie rogów
    rounding = 0

    # Przezroczystość okien
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Przyciemnianie
    dim_inactive = true
    dim_around = 0.1
    dim_special = 0.2
    dim_strength = 0.1

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true

    # Krzywe animacji
    bezier = easeOutQuint, 0.23, 1.0, 0.32, 1.0
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1.0
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1.0

    # Konfiguracja animacji
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = borderangle, 0
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear

    # Animacja obszarów roboczych zmieniona na 'slidevert' (ruch góra-dół)
    animation = workspaces, 1, 2.5, easeOutQuint, slidevert
    animation = workspacesIn, 1, 1.21, almostLinear, slidevert
    animation = workspacesOut, 1, 1.94, almostLinear, slidevert
    animation = zoomFactor, 1, 7, quick
}

#######################
### INPUT & GESTURE ###
#######################

input {
    kb_layout = pl
    follow_mouse = 1
    sensitivity = 0
    natural_scroll = true

    touchpad {
        natural_scroll = true
        drag_lock = false
        middle_button_emulation = true
    }
}

# Zmiana obszarów roboczych ruchem 3 palców pionowo (góra-dół)
gesture = 3, vertical, workspace

gestures {
    # Płynny ruch obszarów roboczych za pomocą touchpada
    workspace_swipe_distance = 300
    workspace_swipe_direction_lock = true
    workspace_swipe_forever = false
    workspace_swipe_touch = false
    workspace_swipe_touch_invert = true
    workspace_swipe_use_r = true
}

# Specyficzna czułość dla myszy (z poprzedniego konfigu)
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

################################
### LAYOUTS & SYSTEM SETTINGS ###
################################

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = slave
    allow_small_split = false
    mfact = 0.5
    new_on_active = after
    new_on_top = false
    special_scale_factor = 1.0
}

scrolling {
    follow_min_visible = 1.0
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

cursor {
    hide_on_key_press = true
    hide_on_tablet = true
    inactive_timeout = 0
    no_hardware_cursors = true
    no_warps = false
    persistent_warps = true
    zoom_factor = 1.0
}

ecosystem {
    enforce_permissions = true
    no_donation_nag = true
    no_update_news = true
}

xwayland {
    force_zero_scaling = false
}

##################################
### WINDOW RULES & WORKSPACES ###
##################################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = true
}

###################
### KEYBINDINGS ###
###################

# Główne aplikacje (uporządkowane wg Twoich nowych skrótów z HyprMod)
# Fullscreen (0 - całkowity, przykrywa wszystko, w tym Waybara)


# Aplikacje (Shift + litera)
bind = $mainMod SHIFT, F, exec, $fileManager
bind = $mainMod SHIFT, B, exec, $browser
bind = $mainMod SHIFT, SPACE, exec, pkill -SIGUSR1 waybar

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, ESCAPE, exec, $powermenu

# Nawigacja oknami (strzałki)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Przenoszenie okien w wybranym kierunku
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Precyzyjne proporcje okna
bind = $mainMod ALT, 1, splitratio, exact 0.50
bind = $mainMod ALT, 2, splitratio, exact 0.66
bind = $mainMod ALT, 3, splitratio, exact 0.75
bind = $mainMod ALT, 4, splitratio, exact 1

# Przełączanie obszarów roboczych
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Przenoszenie okien na inne obszary
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# "Ciche" przenoszenie aktywnego okna na inny workspace (bez podążania za nim) z użyciem SUPER + ALT
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, 0, movetoworkspacesilent, 10

# Scratchpad (magiczny obszar roboczy)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Zmiana obszarów rolką myszy
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Przenoszenie i zmiana rozmiaru myszką
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Klawisze multimedialne i jasność (wymagają wpctl, brightnessctl, playerctl)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -n1 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -n1 set 5%-
bindel = $mainMod, XF86MonBrightnessUp, exec, brightnessctl set 1%+
bindel = $mainMod, XF86MonBrightnessDown, exec, brightnessctl set 1%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
